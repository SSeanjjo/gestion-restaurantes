name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend · pruebas y cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y ejecutar pruebas
        run: mvn -B verify
      - name: Publicar reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: backend/target/site/jacoco

  frontend:
    name: Frontend · compilación de producción
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production

  extremo-a-extremo:
    name: Sistema completo · prueba de humo
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Levantar con Docker Compose
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Prueba de humo de la API
        run: ./scripts/prueba-humo.sh
      - name: Frontend servido por Nginx
        run: curl -sf http://localhost:8081/ | grep -q "<app-root"
      - name: Logs del backend
        if: failure()
        run: docker compose logs backend
